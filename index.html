<title>Hexabox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
  :root{
    --bg:#0B1018;
    --desk:#060910;
    --surface:#141C2B;
    --surface2:#1C2740;
    --ink:#EAF2FF;
    --muted:#8CA0BE;
    --accent:#3FE1C3;
    --accent2:#B47CFF;
    --warn:#FFC857;
    --line:rgba(255,255,255,0.08);
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    background:var(--desk);
    color:var(--ink);
    font-family:'Manrope',system-ui,sans-serif;
    min-height:100vh;
    -webkit-tap-highlight-color:transparent;
  }
  h1,h2,.brand-word,.hud-title,.level-name,button{ font-family:'Chakra Petch','Manrope',system-ui,sans-serif; }
  .mono,#moveCount,.level-num{ font-family:'JetBrains Mono',monospace; font-variant-numeric:tabular-nums; }

  /* #stage always exactly fills the screen (never grows with content) so a
     long, scrollable level list stays an INTERNAL scroll and any modal
     positioned against #stage stays within the visible viewport. */
  #stage{
    max-width:480px;
    margin:0 auto;
    height:100vh;
    background:var(--bg);
    display:flex;
    flex-direction:column;
    padding-inline:16px;
    padding-block:10px;
    box-sizing:border-box;
    position:relative;
    overflow:hidden;
    gap:8px;
  }
  @media (min-width:700px){
    body{ display:flex; align-items:center; }
    #stage{
      height:850px; max-height:92vh;
      border-radius:34px;
      box-shadow:0 36px 90px rgba(0,0,0,0.6), 0 0 0 10px #05070b, 0 0 0 11px #262c3a;
    }
  }

  .topbar{ display:flex; align-items:center; justify-content:space-between; flex:0 0 auto; }
  .brand{ display:flex; align-items:center; gap:8px; font-weight:700; font-size:1.05rem; letter-spacing:0.02em; }
  .brand-hex{ width:22px; height:22px; flex:none; }
  .topbar-right{ display:flex; align-items:center; gap:8px; }
  .total-stars{ color:var(--warn); font-size:0.85rem; font-weight:600; letter-spacing:0.01em; }
  .coin-btn{ width:auto; padding:0 10px; color:var(--warn); font-weight:600; font-size:0.85rem; gap:4px; }

  .view{ flex:1; min-height:0; display:flex; flex-direction:column; }
  .view[hidden]{ display:none!important; }

  #view-select{ gap:18px; overflow-y:auto; padding-bottom:8px; }
  #view-select h1{ margin:4px 0 0; font-size:1.9rem; font-weight:700; letter-spacing:0.01em; text-wrap:balance; }
  .tagline{ margin:0; color:var(--muted); font-size:0.92rem; }
  .unlock-progress{ display:flex; flex-direction:column; gap:4px; }
  .unlock-progress-label{ font-size:0.76rem; color:var(--muted); }
  .unlock-progress-track{ height:6px; border-radius:999px; background:var(--surface2); overflow:hidden; }
  .unlock-progress-fill{ height:100%; background:linear-gradient(90deg,var(--accent),var(--accent2)); border-radius:999px; transition:width 0.4s ease; }
  .level-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:10px; }
  .level-card{
    background:var(--surface); border:1px solid var(--line); border-radius:14px;
    padding:12px 10px 10px; display:flex; flex-direction:column; align-items:center; gap:6px;
    color:var(--ink); cursor:pointer; min-height:120px; justify-content:center;
  }
  .level-card .level-num{ font-size:0.78rem; color:var(--muted); }
  .level-card .level-name{ font-size:0.86rem; font-weight:600; text-align:center; line-height:1.15; }
  .level-card .level-desc{
    font-size:0.72rem; color:var(--muted); text-align:center; line-height:1.25;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .level-card .level-stars{ font-size:0.8rem; letter-spacing:1px; }
  .level-card.cleared{ border-color:rgba(63,225,195,0.4); box-shadow:0 0 0 1px rgba(63,225,195,0.15) inset; }
  .level-card.locked{ opacity:0.45; cursor:not-allowed; }
  .level-card:not(.locked):hover{ background:var(--surface2); }
  .level-card:not(.locked):active{ transform:scale(0.97); }
  .level-card:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .star-on{ color:var(--warn); }
  .star-off{ color:rgba(255,255,255,0.18); }

  #view-game{ gap:6px; }
  .game-hud{ display:flex; align-items:center; gap:8px; flex:0 0 auto; }
  .icon-btn{
    background:var(--surface); border:1px solid var(--line); color:var(--ink);
    border-radius:10px; width:32px; height:32px; flex:none; font-size:0.95rem;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
  }
  .icon-btn:hover{ background:var(--surface2); }
  .icon-btn:active{ transform:scale(0.95); }
  .icon-btn:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .hud-info{ flex:1; min-width:0; }
  .hud-title{ font-weight:600; font-size:0.92rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .hud-moves{ display:flex; flex-direction:column; align-items:center; line-height:1; flex:none; min-width:34px; }
  #moveCount{ font-size:1rem; font-weight:600; color:var(--accent); }
  .hud-moves-label{ font-size:0.58rem; color:var(--muted); text-transform:uppercase; letter-spacing:0.05em; }
  .hud-sub{
    font-size:0.74rem; color:var(--muted); line-height:1.25; flex:0 0 auto;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }

  .mechanics-chips{ display:flex; gap:5px; flex-wrap:wrap; flex:0 0 auto; }
  .chip{
    background:var(--surface2); border:1px solid var(--line); color:var(--muted);
    font-size:0.62rem; padding:2px 8px; border-radius:999px; text-transform:uppercase; letter-spacing:0.04em;
  }

  #canvasWrap{
    flex:1; min-height:0; position:relative; border-radius:16px;
    background:radial-gradient(120% 120% at 50% 0%, #10182a 0%, var(--bg) 70%);
    border:1px solid var(--line); overflow:hidden;
  }
  #board{ display:block; width:100%; height:100%; touch-action:none; }
  #canvasWrap.shake{ animation:shake 0.22s ease; }
  @keyframes shake{ 0%,100%{transform:translateX(0);} 25%{transform:translateX(-6px);} 75%{transform:translateX(6px);} }

  .modal{ position:absolute; inset:0; background:rgba(5,8,13,0.72); display:flex; align-items:center; justify-content:center; padding:16px; z-index:5; }
  .modal[hidden]{ display:none!important; }
  .modal-card{
    background:var(--surface); border:1px solid var(--line); border-radius:18px;
    padding:28px 24px; text-align:center; max-width:320px; width:100%;
    box-shadow:0 20px 60px rgba(0,0,0,0.5); position:relative;
  }
  .modal-stars{ font-size:2.1rem; letter-spacing:4px; margin-bottom:6px; }
  .modal-card h2{ margin:0 0 6px; font-size:1.4rem; }
  .modal-card p{ color:var(--muted); font-size:0.88rem; margin:0 0 18px; }
  .modal-actions{ display:flex; gap:10px; }
  .btn{
    flex:1; border:none; border-radius:10px; padding:11px 10px; font-weight:600; font-size:0.9rem;
    cursor:pointer; color:var(--ink); background:var(--surface2); border:1px solid var(--line);
  }
  .btn.primary{ background:var(--accent); color:#06231c; border-color:transparent; }
  .btn:active{ transform:scale(0.97); }
  .btn:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .btn:disabled{ opacity:0.4; cursor:not-allowed; }

  .shop-card{ max-width:400px; text-align:left; max-height:85%; overflow-y:auto; }
  .shop-card h2{ text-align:center; }
  .shop-card > p{ text-align:center; }
  .skin-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin:14px 0; }
  .skin-card{
    background:var(--surface2); border:1px solid var(--line); border-radius:12px; padding:10px;
    display:flex; flex-direction:column; align-items:center; gap:6px; text-align:center;
  }
  .skin-card.active{ border-color:var(--accent); box-shadow:0 0 0 1px rgba(63,225,195,0.25) inset; }
  .skin-rarity{ font-size:0.6rem; text-transform:uppercase; letter-spacing:0.06em; color:var(--muted); }
  .skin-card.rarity-shine{ border-color:rgba(255,215,0,0.4); }
  .skin-card.rarity-shine .skin-rarity{ color:#FFD700; }
  .skin-card.rarity-animated{ border-color:rgba(176,106,255,0.5); box-shadow:0 0 12px rgba(176,106,255,0.2); }
  .skin-card.rarity-animated .skin-rarity{ color:#B06AFF; }
  .skin-swatches{ display:flex; gap:4px; }
  .skin-swatch{ width:18px; height:18px; border-radius:50%; display:inline-block; border:1px solid rgba(255,255,255,0.2); }
  .skin-name{ font-size:0.82rem; font-weight:600; }
  .skin-status{ font-size:0.74rem; color:var(--accent); font-weight:600; }
  .skin-card .btn{ font-size:0.76rem; padding:7px 8px; }

  #confettiLayer{ position:absolute; inset:0; overflow:hidden; pointer-events:none; }
  .confetti-piece{
    position:absolute; top:-10%; width:8px; height:14px; opacity:0.9;
    animation:confetti-fall 1.3s ease-in forwards;
  }
  @keyframes confetti-fall{
    0%{ top:-10%; opacity:1; }
    100%{ top:105%; opacity:0.2; }
  }

  @media (prefers-reduced-motion:reduce){
    #canvasWrap.shake{ animation:none; }
    .confetti-piece{ animation:none; display:none; }
  }
</style>

<div id="stage">
  <header class="topbar">
    <div class="brand">
      <svg class="brand-hex" viewBox="0 0 24 24" aria-hidden="true">
        <polygon points="12,1 21,6.5 21,17.5 12,23 3,17.5 3,6.5" fill="#3FE1C3"></polygon>
        <polygon points="12,5.5 17,8.5 17,14.5 12,17.5 7,14.5 7,8.5" fill="#0B1018"></polygon>
      </svg>
      <span class="brand-word">HEXABOX</span>
    </div>
    <div class="topbar-right">
      <div class="total-stars" id="totalStars">★ 0 / 300</div>
      <button class="icon-btn coin-btn" id="btnShop" aria-label="Obchod se skiny">
        <span id="coinsCount">✦ 0</span>
      </button>
    </div>
  </header>

  <main id="view-select" class="view">
    <h1>Hexabox</h1>
    <p class="tagline">Doveď drahokamy k cíli a propoj trubky. 100 hexagonálních hádanek.</p>
    <div class="unlock-progress" id="unlockProgress" hidden>
      <div class="unlock-progress-label" id="unlockProgressLabel"></div>
      <div class="unlock-progress-track"><div class="unlock-progress-fill" id="unlockProgressFill"></div></div>
    </div>
    <div class="level-grid" id="levelGrid"></div>
  </main>

  <div class="modal" id="shopModal" hidden>
    <div class="modal-card shop-card">
      <h2>Obchod</h2>
      <p>Vzhledy za jiskry (✦), které získáváš za dokončené úrovně.</p>
      <div class="skin-grid" id="shopGrid"></div>
      <div class="modal-actions">
        <button class="btn primary" id="btnShopClose">Zavřít</button>
      </div>
    </div>
  </div>

  <main id="view-game" class="view" hidden>
    <div class="game-hud">
      <button class="icon-btn" id="btnBack" aria-label="Zpět na mapu">←</button>
      <div class="hud-info">
        <div class="hud-title" id="hudTitle"></div>
      </div>
      <div class="hud-moves"><span id="moveCount">0</span><span class="hud-moves-label">tahů</span></div>
      <button class="icon-btn" id="btnUndo" aria-label="Zpět o tah">↶</button>
      <button class="icon-btn" id="btnReset" aria-label="Restartovat úroveň">⟳</button>
    </div>
    <div class="hud-sub" id="hudSub"></div>
    <div class="mechanics-chips" id="mechChips"></div>
    <div id="canvasWrap">
      <canvas id="board"></canvas>
      <div id="confettiLayer"></div>
      <div class="modal" id="winModal" hidden>
        <div class="modal-card">
          <div class="modal-stars" id="modalStars">★★★</div>
          <h2>Hotovo!</h2>
          <p id="modalMoves"></p>
          <div class="modal-actions">
            <button class="btn" id="btnReplay">Znovu</button>
            <button class="btn primary" id="btnNext">Další úroveň</button>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<script src="logic.js"></script>
<script src="levels.js"></script>
<script src="ads.js"></script>
<script src="app.js"></script>
